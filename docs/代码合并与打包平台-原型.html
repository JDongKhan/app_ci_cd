/* ---------- Toast / 下载 ---------- */
function toast(msg, type){
  var root = byId('toastRoot');
  var el = document.createElement('div');
  el.className = 'toast toast-' + (type || 'info');
  el.innerHTML = '<span class="toast-dot"></span><span>' + esc(msg) + '</span>';
  root.appendChild(el);
  setTimeout(function(){ el.classList.add('out'); setTimeout(function(){ el.remove(); }, 280); }, 3400);
}
function downloadArtifact(buildId){
  var b = state.builds.find(function(x){ return x.id === buildId; });
  if(!b || !b.artifact){ toast('产物不存在','error'); return; }
  var content = 'ShipFlow 原型模拟产物\n' + b.artifact.name + '\n构建 ' + b.id + '\nmerge ' + b.mergeSha + '\n';
  var blob = new Blob([content], { type:'application/octet-stream' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = b.artifact.name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 800);
  toast('开始下载 ' + b.artifact.name, 'info');
}

/* ---------- 事件 ---------- */
/* Esc 逐层关闭：弹框 → 日志 → 流水 → 任务 */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape' && e.keyCode !== 27) return;
  if(ui.modal){ ui.modal = null; renderModal(); return; }
  if(ui.logBuildId){ ui.logBuildId = null; renderDrawer(); return; }
  if(ui.buildId){ ui.buildId = null; renderDrawer(); return; }
  if(ui.pipeId){ ui.pipeId = null; renderDrawer(); return; }
  if(ui.taskId){ ui.taskId = null; renderDrawer(); return; }
  if(ui.reqId){ ui.reqId = null; renderDrawer(); return; }
});

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.dataset.act, id = el.dataset.id;

  if(act === 'overlay'){
    if(e.target.closest('.modal')) return;
    ui.modal = null; renderModal(); return;
  }
  if(act === 'close-modal'){ ui.modal = null; renderModal(); return; }
  if(act === 'home-tab'){ ui.homeTab = id; render(); return; }
  if(act === 'perm-col'){
    var rk = id, pr = rk.split('/'), role = pr[0], lv = pr[1];
    var cols = permColKeys(), have = permsFor(role, lv);
    var allOn = cols.length && cols.every(function(k){ return have.indexOf(k) >= 0; });
    var keep = have.filter(function(k){ return cols.indexOf(k) < 0; });
    state.perms[rk] = allOn ? keep : keep.concat(cols);
    save(); render();
    toast(roleLabel(role)+' '+levelLabel(role,lv)+'：'+(allOn?'已清空 ':'已全选 ')+cols.length+' 项权限');
    return;
  }
  if(act === 'perm'){
    var mk = el.dataset.menu, pk = id;
    var pl = (state.perms[pk] || DEFAULT_PERMS[pk] || []).slice();
    var pi = pl.indexOf(mk);
    if(pi >= 0) pl.splice(pi, 1); else pl.push(mk);
    state.perms[pk] = pl; save(); render();
    return;
  }
  if(act === 'perm-reset'){
    state.permCfg = JSON.parse(JSON.stringify(PERM_CONFIG));
    state.perms = JSON.parse(JSON.stringify(DEFAULT_PERMS));
    save(); render(); toast('已恢复默认：权限配置回到 perm-config，分配回到默认');
    return;
  }
  if(act === 'perm-group'){
    ui.permCollapsed = ui.permCollapsed || {};
    if(ui.permCollapsed[id]) delete ui.permCollapsed[id]; else ui.permCollapsed[id] = true;
    render();
    return;
  }
  if(act === 'perm-toggle-all'){
    var gs = permGroups(), foldedNow = ui.permCollapsed || {};
    var allF = gs.every(function(g){ return foldedNow[g.key]; });
    ui.permCollapsed = {};
    if(!allF) gs.forEach(function(g){ ui.permCollapsed[g.key] = true; });
    render();
    return;
  }
  if(act === 'perm-import'){ ui.modal = { type:'permcfg', mode:'import' }; renderModal(); return; }
  if(act === 'perm-export'){ ui.modal = { type:'permcfg', mode:'export' }; renderModal(); return; }
  if(act === 'perm-copy'){
    var pta = document.querySelector('.perm-json');
    if(!pta) return;
    pta.select();
    var okc = false;
    try{ okc = document.execCommand('copy'); }catch(ec){}
    if(!okc && navigator.clipboard && navigator.clipboard.writeText){
      try{ navigator.clipboard.writeText(pta.value); okc = true; }catch(ec2){}
    }
    toast(okc ? 'JSON 已复制到剪贴板' : '复制失败，请手动全选复制');
    return;
  }
  if(act === 'new-staff'){ ui.modal = { type:'staff' }; renderModal(); return; }
  if(act === 'edit-staff'){ ui.modal = { type:'staff', id:id }; renderModal(); return; }
  if(act === 'reset-pwd'){
    var ra = accountById(id);
    if(!ra) return;
    var cs = 'abcdefghjkmnpqrstuvwxyz23456789', np = '', qi;
    for(qi = 0; qi < 8; qi++) np += cs[Math.floor(Math.random()*cs.length)];
    ra.password = np; save();
    toast('已重置 ' + ra.name + ' 的密码：' + np + '（仅本次显示）');
    return;
  }
  if(act === 'login'){
    ui.userId = id;
    localStorage.setItem(USER_KEY, id);
    ui.taskId = null; ui.pipeId = null; ui.logBuildId = null; ui.reqId = null; ui.tab = 'overview';
    if(location.hash === '#/login' || !location.hash) location.hash = '#/home';
    render();
    toast('已登录：' + accountById(id).name + ' · ' + roleLabel(accountById(id).role), 'success');
    return;
  }
  if(act === 'logout'){
    ui.userId = null; localStorage.removeItem(USER_KEY);
    ui.taskId = null; ui.pipeId = null; ui.logBuildId = null;
    render();
    return;
  }
  if(act === 'switch-user'){
    ui.userId = null; localStorage.removeItem(USER_KEY);
    ui.taskId = null; ui.pipeId = null;
    render();
    return;
  }
  if(act === 'open-task'){ ui.taskId = id; ui.pipeId = null; ui.buildId = null; ui.logBuildId = null; ui.tab = 'overview'; render(); return; }
  if(act === 'close-task'){ ui.taskId = null; render(); return; }
  if(act === 'open-pipe'){ ui.pipeId = id; ui.buildId = null; ui.logBuildId = null; render(); return; }
  if(act === 'close-pipe'){ ui.pipeId = null; render(); return; }
  if(act === 'tab'){
    ui.tab = id; renderDrawer(); return;
  }
  if(act === 'open-req'){
    var rid = state.reqs.some(function(x){ return x.id === id; }) ? id : null;
    if(!rid){ var t0 = taskOf(id), r0 = t0 ? reqOf(t0) : null; rid = r0 ? r0.id : null; }
    if(rid){
      ui.reqId = rid; ui.taskId = null; ui.pipeId = null; ui.logBuildId = null;
      /* 不强制跳转路由：在哪个页面点开就在哪个页面开抽屉（首页「我的需求」只看自己的，不该被带到全量需求列表） */
      render();
    }
    return;
  }
  if(act === 'close-req'){ ui.reqId = null; render(); return; }
  if(act === 'open-log'){ ui.logBuildId = id; render(); return; }
  if(act === 'close-log'){ ui.logBuildId = null; render(); return; }
  if(act === 'pipe-log'){
    var pl = pipeOf(id), plb = pl ? latestBuildOf(pl) : null;
    if(!plb){ toast('这条流水还没有构建记录，先点「打包」生成日志','warn'); return; }
    ui.logBuildId = plb.id; render(); return;
  }
  if(act === 'build-detail'){ ui.buildId = id; ui.logBuildId = null; render(); return; }
  if(act === 'close-build'){ ui.buildId = null; render(); return; }
  if(act === 'back-pipe'){ ui.logBuildId = null; ui.pipeId = id; render(); return; }
  if(act === 'new-pipe'){ ui.modal = { type:'pipe', taskId:id }; renderModal(); return; }
  if(act === 'qa-member'){
    var rr = state.reqs.find(function(x){ return x.id === el.dataset.id; });
    if(!rr) return;
    ui.modal = { type:'qamember', reqId: rr.id };
    renderModal(); return;
  }
  if(act === 'new-task'){ ui.modal = { type:'task', reqId:id }; renderModal(); return; }
  if(act === 'new-req'){ ui.modal = { type:'req' }; renderModal(); return; }
  if(act === 'new-app'){ ui.modal = { type:'app' }; renderModal(); return; }
  if(act === 'edit-app'){ ui.modal = { type:'app', id:id }; renderModal(); return; }
  if(act === 'copy'){
    var txt = el.dataset.copy || '';
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast('已复制：'+txt,'success'); }, function(){ toast('复制失败，请手动选中命令','warn'); });
    } else { toast('复制失败，请手动选中命令','warn'); }
    return;
  }
  if(act === 'conflict-guide'){
    ui.modal = { type:'conflict', pipeId:id }; renderModal(); return;
  }
  if(act === 'resolve'){
    if(ui.modal){ ui.modal = null; renderModal(); }
    resolveConflict(id); return;
  }
  if(act === 'mergeQa'){ doMerge(id, 'qa'); return; }
  if(act === 'mergeUat'){ doMerge(id, 'uat'); return; }
  if(act === 'prepareRelease'){ doMerge(id, 'release'); return; }
  if(act === 'accept'){ doMerge(id, 'master'); return; }
  if(act === 'build'){ runBuild(id); return; }
  if(act === 'qaPass'){ qaPass(id); return; }
  if(act === 'qaReject'){ qaReject(id); return; }
  if(act === 'taskStart' || act === 'taskSubmit' || act === 'taskTest' || act === 'taskRelease' || act === 'taskFinish'){ advanceTask(id); return; }
  if(act === 'verifyPass'){ verifyPass(id); return; }
  if(act === 'rejectTest'){ ui.modal = { type:'reject', pipeId:id, kind:'test' }; renderModal(); return; }
  if(act === 'rejectRelease'){ ui.modal = { type:'reject', pipeId:id, kind:'release' }; renderModal(); return; }
  if(act === 'download'){ downloadArtifact(id); return; }
  if(act === 'dequeue'){
    runtime.queue = runtime.queue.filter(function(q){ return q.pipelineId !== id; });
    save(); render(); toast('已取消排队','info'); return;
  }
  if(act === 'del-task'){
    if(confirm('删除任务会同时删除它下面的 CI 流水，确定吗？')){
      state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
      state.pipelines = state.pipelines.filter(function(x){ return x.taskId !== id; });
      ui.taskId = null; ui.pipeId = null; save(); render();
      toast('任务已删除','info');
    }
    return;
  }
});

document.addEventListener('input', function(e){
  var role = e.target.dataset.role;
  if(role === 'req-q'){ ui.reqQ = e.target.value; render(); }
});

document.addEventListener('input', function(e){
  if(e.target.dataset.role === 'perm-q'){
    ui.permQ = e.target.value;
    render();
    var box = document.querySelector('[data-role="perm-q"]');
    if(box){ box.focus(); try{ box.setSelectionRange(box.value.length, box.value.length); }catch(err){} }
  }
});
document.addEventListener('change', function(e){
  var role = e.target.dataset.role;
  if(role === 'artifact-app'){ ui.artifactApp = e.target.value; render(); }
  if(role === 'staff-role'){
    var sf = e.target.closest('form');
    var sw = sf && sf.querySelector('[data-role="staff-level-wrap"]');
    if(sw) sw.innerHTML = levelOptions(e.target.value, 'l1');
  }
  if(role === 'app-platform'){
    var pf = e.target.value, form0 = e.target.closest('form');
    var DEF = { android:'apk', ios:'ipa', server:'jar', web:'war' };
    if(form0){
      var typeSel = form0.querySelector('[name="artifactType"]');
      if(typeSel && DEF[pf]) typeSel.value = DEF[pf];
    }
  }
  if(role === 'pipe-app'){
    var app = appById(e.target.value);
    var form = e.target.closest('form');
    if(app && form){
      var facts = form.querySelector('[data-role="pipe-app-facts"]');
      if(facts) facts.innerHTML = appFacts(app);
      var nameInput = form.querySelector('[name="name"]');
      var nm = nameInput ? nameInput.value.trim() : '';
      if(nameInput && (!nm || nm === 'Android 包' || nm === 'iOS 包' || nm === 'Web 包' || nm === '服务端 包')){
        nameInput.value = platformLabel(app.platform) + ' 包';
      }
    }
  }
});

document.addEventListener('submit', function(e){
  var form = e.target.closest('[data-form]');
  if(!form) return;
  e.preventDefault();
  var kind = form.dataset.form;
  var fd = new FormData(form);

  if(kind === 'permcfg'){
    var rawJson = fd.get('json') || '';
    var cfgNew;
    try{ cfgNew = JSON.parse(rawJson); }catch(err){ toast('JSON 解析失败：' + err.message,'error'); return; }
    if(!cfgNew || !Array.isArray(cfgNew.groups) || !cfgNew.groups.length){ toast('配置必须有 groups 数组且至少一组','error'); return; }
    var seenKeys = {}, problem = '';
    cfgNew.groups.forEach(function(g){
      if(!g.key || !g.label){ problem = problem || '分组缺少 key / label'; }
      (g.perms || []).forEach(function(pp){
        if(!pp.key || !pp.label){ problem = problem || '权限缺少 key / label'; }
        if(seenKeys[pp.key]){ problem = problem || ('权限 key 重复：' + pp.key); }
        seenKeys[pp.key] = true;
      });
    });
    var missing = MENUS.filter(function(m){ return !seenKeys[m.key]; });
    if(missing.length){
      toast('缺少菜单权限：' + missing.map(function(m){ return m.key; }).join('、') + '，对应菜单会不可用','error');
      return;
    }
    if(problem){ toast(problem,'error'); return; }
    cfgNew.version = cfgNew.version || 1;
    state.permCfg = cfgNew;
    var okKeys = allPermKeys();
    Object.keys(state.perms || {}).forEach(function(k){
      state.perms[k] = (state.perms[k] || []).filter(function(x){ return okKeys.indexOf(x) >= 0; });
    });
    ui.modal = null; save(); render();
    toast('权限配置已更新，共 ' + okKeys.length + ' 项','success');
    return;
  }

  if(kind === 'staff'){
    var sName = (fd.get('name')||'').trim();
    var sAcc = (fd.get('account')||'').trim().toLowerCase();
    var sRole = fd.get('role')||'dev';
    var sLv = sRole === 'admin' ? '' : (fd.get('level')||'l1');
    var sPwd = (fd.get('password')||'').trim();
    var sTeam = (fd.get('team')||'').trim() || '—';
    var sId = form.dataset.id;
    if(!sName){ toast('请填写姓名','error'); return; }
    if(!/^[a-z][a-z0-9._-]{2,}$/.test(sAcc)){ toast('账号需小写字母开头、至少 3 位，可含数字与 . _ -','error'); return; }
    var dup = accounts().filter(function(x){ return x.account === sAcc && x.id !== sId; })[0];
    if(dup){ toast('账号已被占用：' + dup.name,'error'); return; }
    if(!sId && !sPwd){ toast('请填写初始密码','error'); return; }
    var acc = sId ? accountById(sId) : null;
    var COLORS = ['#3b6fd4','#0f8a5f','#b4520e','#7c3aed','#0e7490','#b91c1c','#475569'];
    if(!acc){
      var maxN = accounts().reduce(function(n,x){ return Math.max(n, parseInt(String(x.id).replace('u',''),10)||0); }, 0);
      acc = { id:'u'+(maxN+1), name:sName, role:sRole, level:sLv, account:sAcc, password:sPwd,
              active:true, team:sTeam, color:COLORS[maxN % COLORS.length] };
      state.accounts.push(acc);
    } else {
      acc.name = sName; acc.role = sRole; acc.level = sLv; acc.account = sAcc; acc.team = sTeam;
      if(sPwd) acc.password = sPwd;
    }
    acc.active = fd.get('active') !== '0';
    save(); ui.modal = null; renderModal(); render();
    toast(sId ? '已保存 ' + sName + ' 的角色与权限' : '已新增人员 ' + sName + '，账号 ' + sAcc + ' / 密码 ' + sPwd);
    return;
  }

  if(kind === 'app'){
    var name = (fd.get('name')||'').trim(), code = (fd.get('code')||'').trim(), repo = (fd.get('repo')||'').trim();
    if(!name || !code || !repo){ toast('应用名称、项目标识、仓库地址都要填','error'); return; }
    var payload = {
      name:name, code:code, repo:repo,
      platform:(fd.get('platform')||'android'),
      defaultBranch:(fd.get('defaultBranch')||'main').trim(),
      buildScript:(fd.get('buildScript')||'./build_app').trim(),
      artifactType:fd.get('artifactType')||'apk',
      artifactPattern:(fd.get('artifactPattern')||'').trim() || ('build/**/*.'+(fd.get('artifactType')||'apk')),
      stack:'—', machine:(fd.get('machine')||'builder-01').trim(),
      branches:{ qa:fd.get('qa')||'qa', uat:fd.get('uat')||'uat', release:fd.get('release')||'release', master:fd.get('master')||'master' }
    };
    var id = form.dataset.id;
    if(id){
      var a = appById(id);
      Object.keys(payload).forEach(function(k){ a[k] = payload[k]; });
      toast('应用配置已保存','success');
    } else {
      payload.id = uid('a'); payload.createdAt = fmtNow();
      state.apps.push(payload);
      toast('应用已创建','success');
    }
    ui.modal = null; save(); render(); return;
  }

  if(kind === 'req'){
    var title = (fd.get('title')||'').trim();
    if(!title){ toast('需求标题要填','error'); return; }
    var rStart = fd.get('start') || todayStr(), rDue = fd.get('due') || '';
    if(rDue && rDue < rStart){ toast('结束时间不能早于开始时间','error'); return; }
    state.reqs.push({ id:uid('r'), code:(fd.get('code')||'').trim()||('REQ-'+Math.floor(Math.random()*1000)),
      title:title, desc:(fd.get('desc')||'').trim(),
      devOwner:fd.get('devOwner'), qaOwner:fd.get('qaOwner'), pmOwner:fd.get('pmOwner'),
      priority:fd.get('priority')||'P1', start:rStart, createdAt:fmtNow().slice(0,10), due:rDue||'2026-12-31' });
    ui.modal = null; save(); render(); toast('需求已创建，接下来拆任务','success'); return;
  }

  if(kind === 'qamember'){
    var rqm = state.reqs.find(function(x){ return x.id === form.dataset.req; });
    if(!rqm){ toast('需求不存在','error'); return; }
    if(!canEditQaMembers(rqm)){ toast('只有该需求的测试负责人或管理员能维护测试人员','error'); return; }
    var picked = [].slice.call(form.querySelectorAll('input[name="members"]:checked')).map(function(x){ return x.value; });
    if(rqm.qaOwner && picked.indexOf(rqm.qaOwner) < 0) picked.unshift(rqm.qaOwner);
    if(!picked.length){ toast('至少保留一个测试人员','error'); return; }
    rqm.qaMembers = picked;
    save();
    ui.modal = null; render();
    toast('测试人员已更新：' + picked.map(personName).join('、'),'success');
    return;
  }
  if(kind === 'task'){
    var tt = (fd.get('title')||'').trim();
    if(!tt){ toast('任务标题要填','error'); return; }
    var tStart = fd.get('start') || todayStr(), tDue = fd.get('due') || '';
    if(!tDue){ toast('请选择结束时间','error'); return; }
    if(tDue < tStart){ toast('结束时间不能早于开始时间','error'); return; }
    state.tasks.push({ id:uid('t'), reqId:form.dataset.req, title:tt, desc:(fd.get('desc')||'').trim(),
      ownerId:fd.get('ownerId'), priority:fd.get('priority')||'P1', status:'none',
      start:tStart, createdAt:fmtNow().slice(0,10), due:tDue });
    ui.modal = null; save(); render(); toast('任务已创建，进任务详情点「开始开发」','success'); return;
  }

  if(kind === 'pipe'){
    var pname = (fd.get('name')||'').trim(), branch = (fd.get('branch')||'').trim();
    if(!pname){ toast('流水名称要填','error'); return; }
    if(!branch){ toast('Feature 分支要填','error'); return; }
    var app = appById(fd.get('appId'));
    if(app && [app.branches.qa, app.branches.uat, app.branches.release, app.branches.master].indexOf(branch) >= 0){
      toast('Feature 分支不能与目标分支同名','error'); return;
    }
    state.pipelines.push({ id:uid('p'), taskId:form.dataset.task, appId:fd.get('appId'), name:pname,
      branch:branch, artifactType:app?app.artifactType:'apk',
      status:'none', createdAt:fmtNow(),
      conflicts:{ qa:false, uat:false, release:false, master:false }, merges:[] });
    ui.modal = null; save(); render();
    toast('CI 流水已创建：'+pname,'success'); return;
  }

  if(kind === 'reject'){
    var reason = (fd.get('reason')||'').trim();
    if(!reason){ toast('请填写不通过原因','error'); return; }
    var pid = form.dataset.pipe, k = form.dataset.kind;
    var pf = pipeOf(pid);
    if(!pf){ ui.modal = null; renderModal(); return; }
    if(k === 'test'){
      pf.merges = (pf.merges||[]).filter(function(m){ return m.stage === 'qa'; });
      pf.status = 'dev_merged';
      pf.rework = { from:'uat', label:'测试不通过', reason:reason, by:(me()?me().name:'测试'), at:fmtNow() };
      pf.submittedAt = null;
    } else {
      pf.merges = (pf.merges||[]).filter(function(m){ return m.stage === 'qa' || m.stage === 'uat'; });
      pf.status = 'testing';
      pf.rework = { from:'release', label:'Release 验证不通过', reason:reason, by:(me()?me().name:'测试'), at:fmtNow() };
    }
    ui.modal = null; save(); render();
    toast('已退回上一节点，需重新打包后再流转','warn');
    return;
  }
});

/* ---------- 渲染与路由 ---------- */
function render(){
  var m = me();
  if(!m){
    document.body.classList.add('logged-out');
    byId('sidebar').innerHTML = '';
    byId('view').innerHTML = viewLogin();
    renderDrawer(); renderModal();
    return;
  }
  document.body.classList.remove('logged-out');
  renderSidebar();
  var h = location.hash || '#/home';
  var content;
  if(/^#\/req\//.test(h)){
    var rid0 = h.replace('#/req/', '');
    if(state.reqs.some(function(x){ return x.id === rid0; })) ui.reqId = rid0;
    content = viewReqs();
  } else if(h.indexOf('#/board') === 0){
    content = viewBoard();
  } else if(h.indexOf('#/apps') === 0){
    content = viewApps();
  } else if(h.indexOf('#/reqs') === 0){
    content = viewReqs();
  } else if(h.indexOf('#/artifacts') === 0){
    content = viewArtifacts();
  } else if(h.indexOf('#/roles') === 0){
    content = viewRoles();
  } else if(h.indexOf('#/staff') === 0){
    content = viewStaff();
  } else if(h.indexOf('#/spec') === 0){
    content = viewSpec();
  } else {
    content = viewHome();
  }
  if(!canMenu(routeKey(h))) content = deniedView();
  byId('view').innerHTML = content;
  renderDrawer();
  renderModal();
}
window.addEventListener('hashchange', function(){ ui.taskId = null; ui.pipeId = null; ui.reqId = null; render(); });

/* ---------- 启动 ---------- */
state = loadState();
if(!state.pipelines) state = seed();
if(ui.userId && !me()) ui.userId = null;
if(!location.hash) location.hash = me() ? '#/home' : '#/login';
render();

</script>
