<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShipFlow · 代码合并与打包平台原型</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f4f6f9;--panel:#fff;--line:#e3e9f1;--line2:#eef2f7;
  --ink:#0f172a;--ink2:#4a5768;--ink3:#7d8a9b;
  --blue:#2563eb;--blue-bg:#eef3ff;
  --teal:#0f766e;--teal-bg:#e8f5f2;
  --red:#b91c1c;--red-bg:#fdeeee;
  --amber:#b45309;--amber-bg:#fff5e6;
  --green:#15803d;--green-bg:#e9f7ee;
  --mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px -20px rgba(15,23,42,.22);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.6;
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono)}
.mini{font-size:11.5px}
.shell{display:flex;min-height:100vh}

/* ===== 侧栏 ===== */
.sidebar{position:sticky;top:0;height:100vh;flex:0 0 244px;width:244px;background:#0c1420;color:#cbd5e1;
  display:flex;flex-direction:column;padding:20px 14px 16px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#2563eb,#0ea5e9);
  display:grid;place-items:center;box-shadow:0 6px 16px -8px rgba(37,99,235,.8)}
.brand-name{font-size:15px;font-weight:700;color:#f1f5f9;letter-spacing:.02em}
.brand-sub{font-size:11px;color:#7d8fa5;letter-spacing:.02em}
.nav-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#5b6b80;padding:10px 10px 6px}
nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#9fb0c4;font-size:13px;
  transition:.15s;position:relative}
.nav-item:hover{background:#16202e;color:#e2e8f0}
.nav-item.active{background:#1a2635;color:#fff;font-weight:500}
.nav-item.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:#3b82f6}
.ni-ico{width:16px;height:16px;flex:0 0 16px;opacity:.75;display:grid;place-items:center}
.nav-item.active .ni-ico{opacity:1}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.role-card{background:#131d2a;border:1px solid #1e2b3b;border-radius:10px;padding:10px 11px}
.rc-label{font-size:10.5px;color:#7d8fa5;letter-spacing:.06em;margin-bottom:7px}
.rc-switch{display:flex;gap:5px}
.rc-btn{flex:1;height:26px;border-radius:6px;border:1px solid #26374a;background:#0f1926;color:#8fa2b8;
  font-size:11px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;padding:0 4px}
.rc-btn:hover{color:#e2e8f0;border-color:#3a4f68}
.rc-btn.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.rc-note{font-size:10px;color:#5b6b80;margin-top:7px;line-height:1.5}
.builder-card{background:#131d2a;border:1px solid #1e2b3b;border-radius:10px;padding:11px 12px}
.bc-head{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8fa2b8;margin-bottom:9px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot-on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.16)}
.dot-busy{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.18)}
.bc-row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#b6c5d6;padding:3px 0}
.bc-badge{font-size:10.5px;color:#7dd3a8;background:#16312a;border-radius:4px;padding:1px 6px}
.bc-badge-busy{color:#fcd34d;background:#3a2a12}
.bc-running{font-size:10px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 0 4px;
  border-bottom:1px dashed #24313f;margin-bottom:4px}
.bc-note{font-size:10.5px;color:#66788e;margin-top:7px;border-top:1px solid #1c2837;padding-top:7px}
.btn-side{width:100%;height:31px;border-radius:8px;border:1px solid #22303f;background:#131d2a;color:#8fa2b8;
  font-size:11.5px;cursor:pointer;transition:.15s;font-family:inherit}
.btn-side:hover{color:#e2e8f0;border-color:#33465c}

/* ===== 主区 ===== */
.main{flex:1;min-width:0}
.page{max-width:1260px;margin:0 auto;padding:28px 32px 90px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}
.page-head h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em}
.page-head .sub{margin:5px 0 0;color:var(--ink3);font-size:12.5px}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink3);margin-bottom:8px}
.crumb a{color:var(--ink2)}
.crumb a:hover{color:var(--blue)}

/* ===== 通用组件 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 13px;border-radius:8px;
  border:1px solid #dde4ed;background:#fff;color:#243044;font-size:12.5px;font-weight:500;cursor:pointer;
  white-space:nowrap;transition:.15s;font-family:inherit}
.btn:hover{background:#f8fafc;border-color:#c8d3e1}
.btn:disabled{opacity:.5;cursor:not-allowed;background:#f7f9fc}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 1px 2px rgba(37,99,235,.28)}
.btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8}
.btn-primary:disabled{background:#9fb8ee;border-color:#9fb8ee;color:#fff;opacity:.65}
.btn-build{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 1px 2px rgba(15,118,110,.25)}
.btn-build:hover{background:#0d6259;border-color:#0d6259}
.btn-build:disabled{background:#8fb8b3;border-color:#8fb8b3;color:#fff;opacity:.65}
.btn-danger{background:#fff;border-color:#f0caca;color:var(--red)}
.btn-danger:hover{background:#fdf5f5;border-color:#e3a7a7}
.btn-sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.btn-xs{height:24px;padding:0 8px;font-size:11.5px;border-radius:6px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink2);padding:0 8px}
.btn-ghost:hover{background:#f1f5f9;color:var(--ink)}
.btn-ghost:disabled{background:transparent;border-color:transparent;color:#a5b1c2}
.btn-link{border:0;background:none;color:var(--blue);padding:0;height:auto;font-size:12px;cursor:pointer;font-family:inherit}
.btn-link:hover{text-decoration:underline;color:#1d4ed8}
.spin{width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;
  display:inline-block;animation:rot .7s linear infinite;opacity:.8}
@keyframes rot{to{transform:rotate(360deg)}}

.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;
  font-size:11.5px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill-idle{background:#f1f5f9;color:#4a5768}
.pill-merging{background:var(--blue-bg);color:#1d4ed8}
.pill-conflict{background:var(--red-bg);color:var(--red)}
.pill-merged{background:var(--amber-bg);color:var(--amber)}
.pill-packaged{background:var(--green-bg);color:var(--green)}
.pill-done{background:var(--green-bg);color:var(--green)}
.pill-building{background:#eff6ff;color:#1d4ed8}
.pill-failed{background:#fdecec;color:#b3261e}
.pill-overdue-qa{background:#fdf1e3;color:#b45309}
.spin{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid #c3d7f6;border-top-color:#1d4ed8;
  animation:spin .8s linear infinite;vertical-align:-1px;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.build-running{display:flex;align-items:center;font-size:12px;font-weight:600;color:#1d4ed8}
.build-failed{font-size:12px;font-weight:600;color:#b3261e}
.log-preview{background:#0d1520;border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:11px;
  line-height:1.7;max-height:150px;overflow:auto}
.log-preview .lp{white-space:pre-wrap;word-break:break-all}
.log-preview .ll-cmd{color:#7dd3fc}
.log-preview .ll-ok{color:#6ee7b7}
.log-preview .ll-err{color:#fca5a5}
.log-preview .ll-out{color:#c7d3e0}
tr.row-click{cursor:pointer}
.t-sub.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cell-clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.stage-tag{white-space:nowrap}
tr.row-click:hover td{background:#f8fafd}

.bchip{display:inline-block;position:relative;font-family:var(--mono);font-size:11.5px;padding:1px 7px 1px 18px;
  border-radius:5px;background:#f8fafc;border:1px solid #e3e9f1;color:#3a4759;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%;vertical-align:middle;line-height:1.6}
.bchip::before{content:"";position:absolute;left:7px;top:50%;transform:translateY(-50%);
  width:6px;height:6px;border-radius:2px;background:#94a3b8}
.bchip.src::before{border-radius:50%;background:#94a3b8}
.bchip.qa{background:#eff4ff;border-color:#dbe6ff;color:#1d4ed8}
.bchip.qa::before{background:#3b82f6}
.bchip.uat{background:#fff6e8;border-color:#fae3c0;color:#a16207}
.bchip.uat::before{background:#f59e0b}
.bchip.release{background:#e9f7f4;border-color:#c9ece3;color:#0f766e}
.bchip.release::before{background:#14b8a6}
.bchip.master{background:#f4f0ff;border-color:#e2d9fa;color:#5b46b0}
.bchip.master::before{background:#8b5cf6}

.stage-tag{display:inline-block;font-family:var(--mono);font-size:10px;padding:0 5px;border-radius:4px;
  background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;line-height:1.7;vertical-align:middle}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.section-title{font-size:14px;font-weight:700;margin:30px 0 12px;display:flex;align-items:center;gap:8px}
.section-title .count{font-size:11px;font-weight:500;color:var(--ink3);background:#f1f5f9;border-radius:5px;padding:1px 6px}

/* stats */
.stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.stat-k{font-size:11px;color:var(--ink3);letter-spacing:.02em}
.stat-v{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.stat-n{font-size:10.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.alert .stat-v{color:var(--red)}
.stat.ok .stat-v{color:var(--green)}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;align-items:start}
.col{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:260px}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:3px 4px 10px;border-bottom:1px solid var(--line2);margin-bottom:9px}
.col-name{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.col-name::before{content:"";width:7px;height:7px;border-radius:50%;background:#94a3b8}
.col.c-none .col-name::before{background:#94a3b8}
.col.c-dev .col-name::before{background:#3b82f6}
.col.c-test .col-name::before{background:#0d9488}
.col.c-release .col-name::before{background:#f59e0b}
.col.c-done .col-name::before{background:#22c55e}
.col-count{font-size:11px;color:var(--ink3);background:#f4f6f9;border-radius:5px;padding:1px 7px;font-variant-numeric:tabular-nums}
.col-empty{color:#a5b1c2;font-size:11.5px;text-align:center;padding:22px 0;border:1px dashed #e6ecf4;border-radius:8px}

.tcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;cursor:pointer;transition:.15s}
.tcard:hover{border-color:#c9d6e8;box-shadow:0 6px 16px -12px rgba(15,23,42,.4);transform:translateY(-1px)}
.tcard-top{display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:11px;margin-bottom:5px;white-space:nowrap}
.tcard-ref{font-family:var(--mono);color:#5b6b80;flex:0 0 auto}
.tcard-top .app-nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard h4{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard-title{font-size:12.5px;font-weight:500;line-height:1.45;margin-bottom:7px;color:#16202e}
.branchline{display:flex;flex-direction:column;gap:2px;margin-bottom:7px}
.src-line,.tg-line{display:flex;align-items:center;gap:4px;min-width:0}
.branchline .bchip{font-size:10.5px;max-width:100%}
.arrow{color:#a8b4c4;font-size:11px;flex:0 0 auto;transform:rotate(90deg);line-height:1}
.stage-dots{display:flex;gap:3px;margin-bottom:8px}
.stage-dots.slim{margin:7px 0 0;width:104px}
.sd{flex:1;height:4px;border-radius:2px;background:#e8edf4}
.sd.on{background:#22c55e}
.sd.cur{background:#3b82f6}
.sd.fail{background:#ef4444}
.tcard-note{font-size:10.5px;color:var(--ink3);margin-bottom:8px;line-height:1.5}
.tcard-note.warn{color:var(--red)}
.tcard-note.good{color:var(--green)}
.tcard-foot{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tcard-foot .btn{flex:1 1 auto;width:auto;min-width:0;font-size:11.5px;padding:0 7px}
.role-tag{font-size:10px;padding:1px 6px;border-radius:4px;margin-left:auto;white-space:nowrap;line-height:1.5;flex:0 0 auto}
.role-tag.dev{background:#eff4ff;color:#1d4ed8}
.role-tag.qa{background:#e8f5f2;color:#0f766e}

/* app cards */
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.appcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.appcard-head{display:flex;align-items:center;gap:10px}
.app-avatar{width:36px;height:36px;border-radius:9px;background:#eff4ff;color:#1d4ed8;display:grid;place-items:center;
  font-weight:700;font-size:14px;flex:0 0 36px;border:1px solid #dbe6ff}
.app-name{font-size:14px;font-weight:700}
.app-stack{font-size:11px;color:var(--ink3);margin-top:1px}
.kv{display:flex;gap:8px;font-size:12px;color:var(--ink2);align-items:baseline}
.kv .k{color:var(--ink3);flex:0 0 58px;font-size:11.5px}
.kv .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11.5px;color:#2c3a4d}
.branch-map{display:flex;gap:5px;flex-wrap:wrap;padding-top:2px}
.appcard-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line2);
  padding-top:10px;margin-top:2px;font-size:11.5px;color:var(--ink3)}
.appcard-foot .btn{height:26px;font-size:11.5px;padding:0 9px}

/* requirement cards */
.req-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
select,input[type=text],input[type=date],textarea{font-family:inherit;font-size:12.5px;color:#243044;
  border:1px solid #dde4ed;background:#fff;border-radius:8px;height:32px;padding:0 10px;outline:none;transition:.15s}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%237d8a9b' stroke-width='1.4'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:28px;cursor:pointer}
input:focus,select:focus,textarea:focus{border-color:#9dbcf5;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
textarea{height:auto;min-height:74px;padding:9px 10px;resize:vertical;line-height:1.6}
.search{position:relative;display:inline-flex;align-items:center}
.search input{padding-left:30px;width:220px}
.search svg{position:absolute;left:10px;opacity:.5;pointer-events:none}

.req-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:13px}
.reqcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--shadow);
  cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:10px}
.reqcard:hover{border-color:#cfdcee;box-shadow:0 12px 28px -20px rgba(15,23,42,.5)}
.reqcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.req-code{font-family:var(--mono);font-size:11.5px;color:#5b6b80;letter-spacing:.02em}
.req-title{font-size:13.5px;font-weight:700;line-height:1.5;letter-spacing:-.005em;color:#131f30}
.req-meta{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.req-meta .sep{color:#cbd5e1}
.req-progress{display:flex;flex-direction:column;gap:5px}
.bar{height:5px;border-radius:3px;background:#eef2f7;overflow:hidden}
.bar span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#22c55e);transition:width .35s}
.req-stats{display:flex;gap:6px;flex-wrap:wrap;font-size:10.5px;color:var(--ink3)}
.req-stats .rs{background:#f6f8fb;border:1px solid #e9eff6;border-radius:5px;padding:1px 6px}
.pri{font-size:10.5px;font-weight:600;border-radius:5px;padding:1px 6px}
.pri-P0,.pri-高{background:#fdeeee;color:#b91c1c}
.pri-P1,.pri-中{background:#fff5e6;color:#b45309}
.pri-P2,.pri-低{background:#f1f5f9;color:#5b6b80}

/* table */
table.grid{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.03)}
table.grid th{text-align:left;font-weight:600;color:#64748b;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  padding:10px 13px;background:#f8fafc;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td{padding:12px 13px;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:12.5px}
table.grid tbody tr:last-child td{border-bottom:0}
table.grid tbody tr:hover{background:#fbfcfe}
.t-title{font-size:12.5px;font-weight:600;color:#16202e;cursor:pointer}
.t-title:hover{color:var(--blue)}
.t-sub{font-size:10.5px;color:var(--ink3);margin-top:2px}
.muted{color:var(--ink3);font-size:11.5px}
.warnrow td{background:#fdf7f7;border-bottom:1px solid #f6e3e3;padding:0}
.warnbox{display:flex;gap:12px;align-items:flex-start;padding:10px 13px 11px 14px;border-left:3px solid #dc2626;font-size:11.5px;color:#7f1d1d;line-height:1.6}
.warnbox .wf{font-family:var(--mono);font-size:11px;color:#8b2a2a;display:block}
.warnbox .grow{flex:1;min-width:0}
.warnbox strong{font-weight:600;color:#991b1b}

/* detail header */
.detail-head{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.detail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.detail-title{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:6px 0 4px}
.detail-desc{color:var(--ink2);font-size:12.5px;max-width:760px;line-height:1.65}
.detail-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--ink3)}
.detail-meta b{color:#2c3a4d;font-weight:500;font-family:var(--mono);font-size:11.5px}

/* drawer */
.drawer{position:fixed;top:0;right:0;height:100vh;width:480px;max-width:94vw;background:#fff;border-left:1px solid var(--line);
  box-shadow:-20px 0 50px -26px rgba(15,23,42,.45);display:flex;flex-direction:column;z-index:45;
  animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(26px);opacity:.4}to{transform:none;opacity:1}}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 18px 14px;border-bottom:1px solid var(--line2)}
.drawer-head h3{margin:3px 0 0;font-size:15.5px;font-weight:700;line-height:1.45}
.icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid #e6ecf4;background:#fff;color:#8a97a7;
  cursor:pointer;display:grid;place-items:center;font-size:14px;flex:0 0 28px;transition:.15s;font-family:inherit}
.icon-btn:hover{background:#f4f7fb;color:#334155}
.drawer-body{padding:16px 18px 40px;overflow-y:auto;flex:1}
.statusline{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.stage-dots.big{gap:5px;margin-bottom:14px}
.stage-dots.big .sd{height:6px}
.meta-grid{display:flex;flex-direction:column;gap:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin-bottom:14px}
.mrow{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2);font-size:11.5px;align-items:flex-start}
.mrow:last-child{border-bottom:0}
.mrow .mk{color:var(--ink3);flex:0 0 78px}
.mrow .mv{color:#243044;min-width:0;word-break:break-all}
.drawer-actions{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.drawer-actions .btn{width:100%;height:36px}
.role-hint{background:#fff8eb;border:1px solid #f5e2c1;color:#a16207;border-radius:8px;padding:8px 11px;
  font-size:11.5px;line-height:1.65;margin-bottom:8px}
.blk-title{font-size:12px;font-weight:700;color:#2c3a4d;letter-spacing:.02em;margin:18px 0 9px;display:flex;align-items:center;gap:7px}
.build-item{border:1px solid var(--line2);border-radius:9px;padding:9px 11px;margin-bottom:8px;font-size:11.5px;display:flex;flex-direction:column;gap:4px}
.build-item .bi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.build-item .bi-name{font-family:var(--mono);font-size:11px;color:#2c3a4d;word-break:break-all}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.7;margin:0}
.conflict-box{border:1px solid #f1cccc;background:#fdf6f6;border-radius:9px;padding:11px 12px;margin-bottom:14px;font-size:11.5px;color:#7f1d1d;line-height:1.65}
.conflict-box b{display:block;color:#991b1b;font-size:12px;margin-bottom:4px}

/* timeline */
.timeline{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin-bottom:16px}
.tl{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2);align-items:flex-start}
.tl:last-child{border-bottom:0}
.tl-dot{width:8px;height:8px;border-radius:50%;background:#e2e8f0;margin-top:5px;flex:0 0 8px}
.tl.on .tl-dot{background:#22c55e}
.tl.cur .tl-dot{background:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.tl.fail .tl-dot{background:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.12)}
.tl-t{font-size:12px;font-weight:600;color:#243044;display:flex;align-items:center;gap:6px}
.tl-s{font-size:10.5px;color:#7d8a9b;font-family:var(--mono);margin-top:1px;word-break:break-all}
.tl-x{font-size:10.5px;color:#8a97a7;margin-left:auto;white-space:nowrap;padding-left:8px}

/* log drawer */
.log-drawer{position:fixed;top:0;right:0;height:100vh;width:640px;max-width:96vw;background:#0d1520;color:#c7d3e0;
  display:flex;flex-direction:column;z-index:48;box-shadow:-24px 0 60px -30px rgba(0,0,0,.6);animation:slidein .18s ease-out}
.log-head{padding:15px 18px;border-bottom:1px solid #1d2a3a;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.log-title{font-size:13.5px;font-weight:600;color:#eaf1f8}
.log-sub{font-size:11px;color:#7d8fa3;margin-top:3px;font-family:var(--mono)}
.log-panel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid #1d2a3a;font-size:11px;color:#8ba0b6}
.progress-track{height:5px;background:#172335;border-radius:3px;overflow:hidden}
.progress-track span{display:block;height:100%;width:0;background:linear-gradient(90deg,#2563eb,#22c55e);transition:width .3s}
.progress-track.light{background:#eef2f7;height:6px;border-radius:4px}
.progress-track.light span{background:linear-gradient(90deg,#2563eb,#22c55e);border-radius:4px}
.logbox{flex:1;overflow-y:auto;padding:14px 18px 30px;font-family:var(--mono);font-size:11.8px;line-height:1.85;background:#0b131d}
.ll{white-space:pre-wrap;word-break:break-all}
.ll-cmd{color:#6eb6ff}
.ll-out{color:#b9c6d6}
.ll-dim{color:#5f7287}
.ll-ok{color:#4ade80}
.ll-warn{color:#fbbf24}
.ll-err{color:#f87171}
.log-empty{color:#4c5f73;font-style:italic}
.log-foot{padding:11px 18px;border-top:1px solid #1d2a3a;display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:11px;color:#7d8fa3}
.log-drawer .icon-btn{background:#152132;border-color:#233247;color:#8ba0b6}
.log-drawer .icon-btn:hover{background:#1b293c;color:#e2e8f0}
.log-drawer .btn{background:#152132;border-color:#233247;color:#c7d3e0}
.log-drawer .btn:hover{background:#1b293c;color:#eaf1f8}
.log-drawer .btn-primary{background:#2563eb;border-color:#2563eb;color:#fff}

/* 代码合并冲突通知 */
.ci-facts{display:grid;grid-template-columns:88px 1fr;gap:7px 14px;font-size:12px;padding:12px 14px;
  border:1px solid var(--line2);border-radius:10px;background:#fafbfc;margin-bottom:16px}
.ci-facts .k{color:#7d8a9b}
.ci-facts .v{font-family:var(--mono);font-size:11.5px;word-break:break-all;color:#0f172a}
.ci-step{display:flex;gap:10px;margin-bottom:13px}
.ci-num{flex:none;width:19px;height:19px;border-radius:50%;background:#eef2ff;color:#2563eb;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ci-step-main{flex:1;min-width:0}
.ci-step-main .t{font-size:12.5px;color:#374151;margin-bottom:6px;line-height:1.6}
.cmd{display:flex;align-items:center;gap:8px;background:#f4f6f8;border:1px solid #e5e8ee;border-radius:8px;padding:7px 10px}
.cmd code{flex:1;font-family:var(--mono);font-size:11.5px;color:#0f172a;word-break:break-all}
.cmd .cp{flex:none;border:1px solid #d7dce4;background:#fff;border-radius:6px;font-size:11px;padding:3px 9px;cursor:pointer;color:#475569}
.cmd .cp:hover{border-color:#2563eb;color:#2563eb}
.ci-tip{font-size:11.8px;color:#8a5209;background:#fffaef;border:1px solid #f3d9b6;border-radius:8px;padding:9px 12px;margin-top:4px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,18,28,.42);z-index:60;display:flex;align-items:flex-start;justify-content:center;
  padding:56px 20px 32px;overflow-y:auto;animation:fade .16s ease-out;backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:14px;width:660px;max-width:100%;box-shadow:0 30px 80px -30px rgba(10,18,28,.6);
  animation:pop .18s ease-out;margin-bottom:40px}
@keyframes pop{from{transform:translateY(10px) scale(.985);opacity:.5}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid var(--line2)}
.modal-head h3{margin:0;font-size:16px;font-weight:700}
.modal-head p{margin:4px 0 0;font-size:11.5px;color:var(--ink3)}
.modal-body{padding:18px 22px}
.modal-foot{padding:14px 22px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:11.5px;font-weight:600;color:#374559;letter-spacing:.01em}
.field .req-star{color:#dc2626;margin-left:2px}
.field .fx{font-size:10.5px;color:var(--ink3);line-height:1.5}
.field input,.field select,.field textarea{width:100%}
.inline4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.inline4 .lb{font-size:11px;color:#64748b;margin-bottom:4px;display:block}
.form-divider{grid-column:1/-1;border-top:1px solid var(--line2);margin:4px 0 2px;padding-top:12px;
  font-size:11.5px;font-weight:700;color:#374559;letter-spacing:.02em}
.flow-hint{grid-column:1/-1;background:#fbfcfe;border:1px dashed #e0e8f2;border-radius:8px;padding:9px 11px;
  font-size:11.5px;color:#5b6b80;line-height:1.8}

/* spec */
.spec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 26px;box-shadow:var(--shadow);margin-bottom:16px;overflow-x:auto}
.spec h2{margin:0 0 4px;font-size:16px;font-weight:700}
.spec h2 .n{font-family:var(--mono);font-size:11px;color:#9aa7b7;margin-right:8px}
.spec p{margin:6px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.75}
.spec ul{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink2);line-height:1.85}
.spec table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.spec table th{text-align:left;background:#f8fafc;color:#64748b;font-size:11px;font-weight:600;letter-spacing:.04em;
  padding:7px 10px;border:1px solid var(--line)}
.spec table td{padding:7px 10px;border:1px solid var(--line);color:#243044;vertical-align:top}
.spec table td.mono{font-size:11.5px;color:#334155}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.fnode{background:#f8fafc;border:1px solid #dfe7f1;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:500;color:#2c3a4d}
.fnode.acc{background:var(--blue-bg);border-color:#d5e2ff;color:#1d4ed8}
.fnode.warn{background:var(--amber-bg);border-color:#f7e2c2;color:var(--amber)}
.fnode.ok{background:var(--green-bg);border-color:#cdebd8;color:var(--green)}
.fnode.err{background:var(--red-bg);border-color:#f4d2d2;color:var(--red)}
.farr{color:#a8b4c4;font-size:13px}
.fnote{margin-top:10px;font-size:11.5px;color:var(--ink3);background:#fbfcfe;border:1px dashed #e4eaf2;border-radius:8px;padding:9px 12px;line-height:1.7}
.todo{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed #e9eff6;font-size:12.5px;align-items:flex-start}
.todo:last-child{border-bottom:0}
.todo .num{font-family:var(--mono);font-size:11px;color:#9aa7b7;flex:0 0 22px;padding-top:2px}
.todo .q{font-weight:600;color:#243044}
.todo .a{color:var(--ink3);font-size:11.5px;display:block;margin-top:1px}

/* toast */
.toast-root{position:fixed;right:22px;bottom:22px;z-index:80;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;box-shadow:0 18px 40px -20px rgba(15,23,42,.5);font-size:12.5px;max-width:420px;
  animation:tin .2s ease-out;transition:.25s}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.toast.out{opacity:0;transform:translateY(6px)}
.toast-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:var(--blue)}
.toast-success .toast-dot{background:#22c55e}
.toast-error .toast-dot{background:#ef4444}
.toast-warn .toast-dot{background:#f59e0b}

.empty{text-align:center;padding:60px 20px;color:var(--ink3);font-size:12.5px}
.empty .big{font-size:15px;color:#3a4759;font-weight:600;margin-bottom:6px}

/* responsive */
@media (max-width:1240px){
  .board{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat-row{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:900px){
  .shell{flex-direction:column}
  .sidebar{position:relative;height:auto;width:100%;flex:none;flex-direction:column;padding:14px 14px 10px}
  .sidebar .nav-label,.builder-card,.btn-side{display:none}
  .side-foot{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .role-card{display:flex;flex-direction:row;align-items:center;gap:8px;padding:6px 8px;margin:0}
  .rc-label,.rc-note{display:none}
  .rc-switch{flex:1}
  .rc-btn{height:28px}
  .brand{padding:0 0 12px}
  .sidebar nav{display:flex;flex-direction:row;gap:4px;overflow-x:auto;padding-bottom:4px;min-width:0}
  .nav-item{flex:0 0 auto;padding:6px 10px;font-size:12.5px;white-space:nowrap}
  .nav-item .ni-ico{display:none}
  .page{padding:20px 16px 70px}
  .page-head{flex-direction:column}
  .page-head h1{font-size:20px}
  .board{grid-template-columns:1fr}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .app-grid,.req-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .inline4{grid-template-columns:repeat(2,1fr)}
  table.grid{display:block;overflow-x:auto;white-space:nowrap}
  .drawer,.log-drawer{width:100%}
  .main{overflow-x:hidden}
}

/* ===== v7 追加：登录 / 首页 / 任务详情 / CI 流水 ===== */
.logged-out .sidebar{display:none}
.logged-out .main{width:100%}

/* 登录 */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:40px 20px;
  background:radial-gradient(1200px 600px at 20% -10%,#16304d 0%,#0b1421 55%,#0a111b 100%)}
.login-card{width:800px;max-width:100%;background:#fff;border-radius:20px;padding:32px 34px 26px;
  box-shadow:0 50px 110px -50px rgba(0,0,0,.75)}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login-title{font-size:19px;font-weight:700;letter-spacing:-.01em}
.login-sub{font-size:11.5px;color:var(--ink3);margin-top:2px}
.login-lead{font-size:12px;color:var(--ink2);margin-bottom:14px}
.login-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login-user{display:flex;align-items:center;gap:12px;text-align:left;background:#fbfcfe;border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;cursor:pointer;transition:.15s;font-family:inherit}
.login-user:hover{border-color:#bfd3f5;background:#f6f9ff;box-shadow:0 8px 22px -16px rgba(37,99,235,.6);transform:translateY(-1px)}
.lu-avatar{width:38px;height:38px;border-radius:10px;color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700;flex:0 0 38px}
.lu-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lu-main b{font-size:13.5px;color:#16202e}
.lu-role{font-size:11px;color:var(--ink3)}
.lu-desc{font-size:10.5px;color:#8a97a7;line-height:1.5;margin-top:3px}
.lu-arrow{font-size:11px;color:#2563eb;flex:0 0 auto}
.login-foot{margin-top:16px;padding-top:13px;border-top:1px solid var(--line2);font-size:10.8px;color:#8a97a7;line-height:1.7}

/* 侧栏新增 */
.nav-label{font-size:10.5px;color:#5d6f84;letter-spacing:.12em;padding:6px 10px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:12.5px;color:#a9bbcd;transition:.15s}
.nav-item:hover{background:#131f2e;color:#eaf1ff}
.nav-item.on{background:#15263c;color:#eaf1ff;font-weight:600}
.nav-badge{margin-left:auto;background:#2563eb;color:#fff;font-size:10px;border-radius:999px;min-width:17px;height:17px;
  display:grid;place-items:center;padding:0 5px}
.side-foot{margin-top:auto;border-top:1px solid #1a2839;padding-top:12px;margin-bottom:10px}
.side-user{display:flex;align-items:center;gap:9px;padding:2px 4px 9px}
.su-avatar{width:30px;height:30px;border-radius:8px;color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:0 0 30px}
.su-main{display:flex;flex-direction:column;min-width:0}
.su-main b{font-size:12.5px;color:#e6edf6;font-weight:600}
.su-main span{font-size:10.5px;color:#7d8fa5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-acts{display:flex;gap:6px}
.side-acts .btn{flex:1;background:#152132;border-color:#233247;color:#c7d3e0;font-size:11.5px;height:28px}
.side-acts .btn:hover{background:#1b293c;color:#eaf1f8}
.built-card{background:#0f1a28;border:1px solid #1b293b;border-radius:10px;padding:10px 11px;font-size:11px;color:#9db0c4}
.bc-top{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#d6e2ef;margin-bottom:7px}
.dot-idle{width:6px;height:6px;border-radius:50%;background:#22c55e}
.bc-row{display:flex;justify-content:space-between;padding:2px 0;color:#8ba0b6}
.bc-tag{color:#cfe0f2}
.bc-hint{margin-top:6px;padding-top:6px;border-top:1px solid #1b293b;font-size:10px;color:#687d93;line-height:1.6}

/* 首页 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px;margin-bottom:18px}
.home-tabs{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.htab{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:#4a5768;font-size:12px;cursor:pointer;font-family:inherit}
.htab:hover{border-color:#c9d9f8;background:#f8fbff}
.htab.on{background:#eff4ff;border-color:#c9d9f8;color:#1d4ed8;font-weight:600}
.htab .cnt{font-family:var(--mono);font-size:11px;background:#f1f5f9;border-radius:5px;padding:0 5px;color:#4a5768}
.htab.on .cnt{background:#fff;color:#1d4ed8}
.htab-hint{font-size:11px;color:#94a3b8;margin-left:auto}
.stat-v.accent{color:#2563eb}
.card-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.card-head h2{font-size:13.5px;margin:0;font-weight:700}
.pill-role{background:#eef2ff;color:#3730a3}
.pbar{height:5px;background:#eef2f7;border-radius:3px;overflow:hidden;width:100%}
.pbar span{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e)}
.pbar-t{font-size:10px;color:#7d8a9b;margin-top:3px}
.pmini{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:1px 7px;border-radius:6px;margin:2px 4px 2px 0;
  border:1px solid #e5e8ee;background:#fbfcfe;color:#4a5768;max-width:100%}
.pmini b{font-weight:600;color:#1f2937;font-size:10px}
.pmini.pill-conflict{background:#fdf0f0;border-color:#f4d5d5;color:#b91c1c}
.pmini.pill-done{background:#eefaf2;border-color:#cdeedb;color:#15803d}
.pmini.pill-merging{background:#eff4ff;border-color:#dbe6ff;color:#1d4ed8}
.pmini.pill-merged{background:#fff7ea;border-color:#f6e3c4;color:#a16207}
.pmini.pill-packaged{background:#eefaf2;border-color:#cdeedb;color:#15803d}
.pmini.pill-ready,.pmini.pill-testing,.pmini.pill-verify,.pmini.pill-verified{background:#f5f3ff;border-color:#e3dcfb;color:#5b46b0}

/* 看板（3 列） */
.board{display:grid;grid-template-columns:repeat(7,minmax(200px,1fr));gap:10px;align-items:start;overflow-x:auto;padding-bottom:6px}
.col.c-overdue .col-head span:first-child::before{background:#ef4444}
.col.c-ready .col-head span:first-child::before{background:#8b5cf6}

/* =========================================================
   ShipFlow 一期原型（v1）：登录 → 首页 → 需求 → 任务 → CI 流水
   任务只表达“谁在做什么”，一条任务下可挂多条 CI 流水
   （例如 Flutter 任务同时打 Android apk 与 iOS ipa）
   每条流水独立走：合并 QA → 打包自测 →（任务提测）→ 合并 UAT；开始与提测都在任务上点
   → 合并 Release → 打包验证 → 合回 master

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function pad2(n){ n = String(n); return n.length < 2 ? '0'+n : n; }
function fmtNow(d){
  d = d || new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function randSha(){
  var c = '0123456789abcdef', s = '';
  for(var i=0;i<7;i++) s += c[Math.floor(Math.random()*16)];
  return s;
}
function uid(pre){ uid.n = (uid.n||0)+1; return pre + Date.now().toString(36).slice(-4) + uid.n; }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function shortBranch(b){ return b; }
function slugifyBranch(branch){
  var last = String(branch||'').split('/').pop().replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/^[-.]+|[-.]+$/g,'');
  return last || 'feature';
}

    permCfg:JSON.parse(JSON.stringify(PERM_CONFIG)) };
}

function deriveTaskStatus(st, t){
  var ps = (st.pipelines||[]).filter(function(p){ return p.taskId === t.id; });
  if(!ps.length) return 'none';
  if(ps.every(function(p){ return p.status === 'done'; })) return 'done';
  var min = 9;
  ps.forEach(function(p){
    var rk = 1;
    if(p.status === 'dev_passed' || p.status === 'ready_test') rk = 2;
    else if(/^test_/.test(p.status) || p.status === 'testing') rk = 3;
    else if(/^release_/.test(p.status) || /^accept_/.test(p.status)) rk = 4;
    if(rk < min) min = rk;
  });
  return ['none','dev','ready','testing','release'][min] || 'dev';
}
function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return seed();
    var st = JSON.parse(raw);
    if(!st || st.v !== PROTO_V) return seed();
    if(!st.accounts || !st.accounts.length) st.accounts = ACCOUNTS.map(function(a){ return JSON.parse(JSON.stringify(a)); });
    (st.tasks||[]).forEach(function(t){
      if(!t.start) t.start = t.createdAt || '—';
      if(!TASK_STATES[t.status]) t.status = deriveTaskStatus(st, t);
    });
    (st.reqs||[]).forEach(function(r){
      if(!r.devOwner) r.devOwner = r.ownerId || 'u1';
      if(!r.qaOwner) r.qaOwner = 'u2';
      if(!r.pmOwner) r.pmOwner = r.ownerId || 'u4';
      if(!r.qaMembers || !r.qaMembers.length) r.qaMembers = [r.qaOwner];
      if(['高','中','低'].indexOf(r.priority) >= 0) r.priority = ({'高':'P0','中':'P1','低':'P2'})[r.priority];
    });
    if(!st.perms) st.perms = JSON.parse(JSON.stringify(DEFAULT_PERMS));
    if(!st.permCfg || !st.permCfg.groups || !st.permCfg.groups.length
       || (st.permCfg.version||0) < (PERM_CONFIG.version||0)){
      st.permCfg = JSON.parse(JSON.stringify(PERM_CONFIG));
    }
    var validKeys = [];
    (st.permCfg.groups || []).forEach(function(g){
      (g.perms || []).forEach(function(pp){ validKeys.push(pp.key); });
    });
    Object.keys(st.perms).forEach(function(k){
      st.perms[k] = (st.perms[k] || []).filter(function(x){ return validKeys.indexOf(x) >= 0; });
    });
    return st;
  }catch(e){ return seed(); }
}

}

function mergedCount(p){ return (p.merges||[]).length; }
function stageDone(p, stage){ return (p.merges||[]).some(function(m){ return m.stage === stage; }); }

/* ---------- 任务状态（任务自身状态机，按钮推进） ---------- */
function todayStr(){ return fmtNow().slice(0,10); }
var TASK_STATES = {
  none:    { key:'none',    label:'未开始', cls:'none',    rank:0, hint:'任务已建但还没开始，开发在任务详情点「开始开发」进入开发阶段。' },
  dev:     { key:'dev',     label:'开发中', cls:'dev',     rank:1, hint:'开发阶段：在流水里合并 QA、打包、自测；自测通过后由开发在任务上点「提测」。' },
  ready:   { key:'ready',   label:'已提测', cls:'ready',   rank:2, hint:'开发已提测，等测试在任务上点「开始测试」；期间不占开发的工作量。' },
  testing: { key:'testing', label:'测试中', cls:'testing', rank:3, hint:'测试阶段：流水里合并 UAT、打包 UAT、跑测试；通过后由测试点「进入待发布」。' },
  release: { key:'release', label:'待发布', cls:'verify',  rank:4, hint:'发布阶段：流水里合并 Release、打包 Release、验证；验证通过后可下载产物并合回 master。' },
  done:    { key:'done',    label:'已结束', cls:'done',    rank:5, hint:'任务已发布结束，产物可继续下载，不再推进状态。' }
};
var TASK_CHAIN = ['none','dev','ready','testing','release','done'];
function taskStatusKey(t){ return (t && TASK_STATES[t.status]) ? t.status : 'none'; }
function taskRank(t){ return (TASK_STATES[taskStatusKey(t)]||TASK_STATES.none).rank; }
function daysLate(due){
  var d = (new Date(todayStr()) - new Date(due)) / 86400000;
  return Math.max(0, Math.round(d));
}
function taskState(t){
  var key = taskStatusKey(t);
  var st = TASK_STATES[key];
  if(key !== 'done' && t.due && t.due < todayStr()){
    var over = st.rank >= 2 ? 'qa' : 'dev';      // 已提测（rank 2）起算测试侧
    var late = daysLate(t.due);
    return {
      key:'overdue', over:over, days:late, rank:st.rank, base:key,
      label: over === 'qa' ? '测试超时' : '开发超时',
      cls:   over === 'qa' ? 'overdue-qa' : 'overdue',
      phase: over === 'qa' ? (key==='ready'?'已提测 / 待开始测试':(key==='testing'?'测试中':'待发布 / Release 验证')) : (key==='none'?'未开始（还没点开始开发）':'开发中（未提测）'),
      hint: '已超过结束时间 '+t.due+'（超期 '+late+' 天），当前任务状态为「'+st.label+'」，属于'+
            (over === 'qa' ? '测试侧超时（开发已提测）' : '开发侧超时（还没提测）')
    };
  }
  return { key:st.key, label:st.label, cls:st.cls, hint:st.hint, rank:st.rank };
}
function taskProgress(t){
  var ps = pipesOf(t.id);
  if(!ps.length) return 0;
  var sum = 0;
  ps.forEach(function(p){ sum += mergedCount(p) / 4; });
  return Math.round(sum / ps.length * 100);
}

/* ---------- 产物 ---------- */
function buildOf(p){
  if(!p) return null;
  if(p.buildId){
    var b = state.builds.find(function(x){ return x.id === p.buildId; });
    if(b && b.status === 'success' && b.artifact) return b;
  }
  var ok = state.builds.filter(function(x){ return x.pipelineId === p.id && x.status === 'success' && x.artifact; });
  if(!ok.length) return null;
  return ok.sort(function(a,b){ return String(a.startedAt) < String(b.startedAt) ? 1 : -1; })[0];
}
function buildsOf(p){ return state.builds.filter(function(x){ return x.pipelineId === p.id; }); }
function freshBuild(p, stage){
  var last = (p.merges||[]).filter(function(m){ return m.stage === stage; }).slice(-1)[0];
  if(!last) return null;
  return state.builds.filter(function(b){
    return b.pipelineId === p.id && b.stage === stage && b.mergeSha === last.sha && b.status === 'success' && b.artifact;
  }).sort(function(a,b){ return String(a.startedAt) < String(b.startedAt) ? 1 : -1; })[0] || null;
}
function buildStatusMeta(b){
  if(!b) return { label:'—', cls:'none' };
  if(b.status === 'success') return { label:'已入库', cls:'done' };
  if(b.status === 'running') return { label:'打包中', cls:'building' };
  return { label:'失败', cls:'failed' };
}
function latestBuildOf(p){
  var bs = buildsOf(p);
  if(!bs.length) return null;
  var run = bs.filter(function(b){ return b.status === 'running'; })[0];
  if(run) return run;
  return bs.slice().sort(function(a,b){ return String(a.startedAt) < String(b.startedAt) ? 1 : -1; })[0];
}
function shortArtifact(b){
  if(!b || !b.artifact) return '—';
  var n = b.artifact.name;
  return n.length > 30 ? n.slice(0, 27) + '…' : n;
}

function isQueued(p){ return runtime.queue.some(function(q){ return q.pipelineId === p.id; }); }
function queuePos(p){ return runtime.queue.findIndex(function(q){ return q.pipelineId === p.id; }) + 1; }
function machineBusy(){ return !!runtime.busy; }

/* ---------- 权限 ---------- */
function canRole(role){
  var m = me();
  if(!m) return false;
  if(m.role === 'pm') return false;
  if(m.role === 'admin') return true;
  return m.role === role;
}
function roleLockReason(role){
  var m = me();
  if(!m) return '请先登录';
  if(m.role === 'pm') return '产品角色只能查看进度，代码合并与打包由开发/测试执行';
  return '需要切换到「'+roleLabel(role)+'」账号才能操作这一步';
}

/* ---------- 合并 ---------- */
function canMerge(p, stage){
  if(runtime.busy) return false;
  if(p.status === 'done') return false;
  if(stage === 'qa') return p.status === 'none' || p.status === 'dev_conflict' || (p.status === 'dev_merged' && !!p.rework);
  if(stage === 'uat') return p.status === 'dev_passed' || p.status === 'test_conflict';
  if(stage === 'release') return p.status === 'testing' || p.status === 'release_conflict';
  if(stage === 'master') return p.status === 'release_verified' || p.status === 'accept_conflict';
  return false;
}
function tempBranchName(p, stage){
  var c = (p.conflicts||{})[stage];
  if(c && typeof c === 'object' && c.temp) return c.temp;
  var name = 'temp/Conflict_' + branchName(p, stage) + '_feature/' + slugifyBranch(p.branch) + '_' + branchStamp();
  if(c){
    p.conflicts = p.conflicts || {};
    p.conflicts[stage] = { at: fmtNow(), temp: name, files: (p.conflictFiles||[]).slice() };
    save();
  }
  return name;
}
function branchStamp(d){
  d = d || new Date();
  return String(d.getFullYear()).slice(2)+'.'+pad2(d.getMonth()+1)+pad2(d.getDate())+'.'+pad2(d.getHours())+pad2(d.getMinutes())+'.'+pad2(d.getSeconds());
}
function conflictFilesFor(p, stage){
  var known = {
    qa: ['lib/features/transfer/transfer_service.dart','lib/features/transfer/widgets/transfer_card.dart'],
    uat: ['lib/features/transfer/widgets/transfer_card.dart'],
    release: ['lib/features/transfer/widgets/transfer_card.dart','lib/ui/common/theme.dart'],
    master: ['CHANGELOG.md']
  };
  return known[stage] || ['目标分支存在冲突'];
}

function doMerge(pid, stage){
  var p = pipeOf(pid);
  if(!p) return;
  if(runtime.busy){ toast('打包机正在构建，此时禁止切分支合并','error'); return; }
  if(!canMerge(p, stage)){ toast('当前流水状态不能执行该阶段合并','warn'); return; }
  var plan = MERGE_PLAN[stage];
  if(!canRole(plan.role)){ toast(roleLockReason(plan.role),'warn'); return; }

  var viaTemp = /conflict/.test(p.status) ? (p.resolveViaTemp || tempBranchName(p, stage)) : null;
  p.status = plan.busy;
  save(); render();

  setTimeout(function(){
    if(!viaTemp && p.conflicts && p.conflicts[stage]){
      p.status = plan.fail;
      p.conflictFiles = conflictFilesFor(p, stage);
      p.conflicts[stage] = { at: fmtNow(), temp: 'temp/Conflict_'+branchName(p,stage)+'_feature/'+slugifyBranch(p.branch)+'_'+branchStamp(),
        files: p.conflictFiles.slice() };
      save(); render();
      ui.modal = { type:'conflict', pipeId:p.id };
      renderModal();
      toast('合并中止：Feature 分支 '+p.branch+' → '+branchName(p,stage)+' 有冲突，已创建临时分支 '+p.conflicts[stage].temp,'error');
      return;
    }
    p.merges = p.merges || [];
    p.merges.push({ stage:stage, from: viaTemp || p.branch, to: branchName(p,stage), sha: randSha(),
      at: fmtNow(), commits: 1 + Math.floor(Math.random()*3) });
    p.status = plan.ok;
    if(p.conflicts) p.conflicts[stage] = false;
    p.conflictFiles = [];
    p.resolveViaTemp = null;
    p.rework = null;
    save(); render();
    var msg = {
      qa: '已合入 '+branchName(p,'qa')+'，打包成功后自测',
      uat: '已合入 '+branchName(p,'uat')+'，测试进行中',
      release: '已合入 '+branchName(p,'release')+'，打包后做 Release 验证',
      master: 'release 已合入 master，流水结束'
    }[stage];
    toast(msg,'success');
    if(location.hash.indexOf('#/task') < 0) {}
  }, 1100);
}
function resolveConflict(pid){
  var p = pipeOf(pid);
  if(!p) return;
  if(!/conflict/.test(p.status)){ toast('当前流水没有待解决的冲突','warn'); return; }
  var stage = currentStage(p);
  var temp = tempBranchName(p, stage);
  p.conflicts[stage] = { at: fmtNow(), temp: temp, files: (p.conflictFiles||[]).slice(), resolved:true };
  p.conflictFiles = [];
  p.resolveViaTemp = temp;
  save(); render();
  toast('已确认冲突已在临时分支上解决，正在把 '+temp+' 合入 '+branchName(p,stage),'warn');
  doMerge(pid, stage);
}

/* ---------- 提测 / 自测 / 验证 ---------- */
/* 提测已移到任务状态机（任务详情「提测」按钮），流水不再有提测动作 */
function qaPass(pid){
  var p = pipeOf(pid);
  if(!p) return;
  if(!canRole('dev')){ toast(roleLockReason('dev'),'warn'); return; }
  if(p.status !== 'dev_built' && !(p.status === 'dev_merged' && buildOf(p))){ toast('当前状态不需要自测确认','warn'); return; }
  if(!freshBuild(p,'qa')){ toast('QA 包不存在或已失效，请先重新打包','error'); return; }
  p.status = 'dev_passed';
  save(); render();
  toast('自测通过，可以提测了','success');
}
function qaReject(pid){
  var p = pipeOf(pid);
  if(!p) return;
  if(!canRole('dev')){ toast(roleLockReason('dev'),'warn'); return; }
  if(!freshBuild(p,'qa')){ toast('还没有可拒绝的 QA 包','warn'); return; }
  p.status = 'dev_merged';
  p.rework = { from:'qa', label:'QA 自测不通过', reason:'开发自测未通过，需要修改代码后重新合并', by: (me()?me().name:'开发'), at: fmtNow() };
  p.submittedAt = null;
  save(); render();
  toast('已拒绝：回到代码合并，改完重新合并 QA 并重打包','warn');
}
function verifyPass(pid){
  var p = pipeOf(pid);
  if(!p) return;
  if(!canRole('qa')){ toast(roleLockReason('qa'),'warn'); return; }
  if(!freshBuild(p,'release')){ toast('还没有成功的 Release 包，无法验收','error'); return; }
  p.status = 'release_verified';
  save(); render();
  toast('Release 验证通过，可下载产物并把 release 合回 master','success');
}
function rejectPipe(pid, kind){
  var p = pipeOf(pid);
  if(!p) return;
  if(!canRole('qa')){ toast(roleLockReason('qa'),'warn'); return; }
  if(kind === 'test'){
    if(p.status !== 'testing' && !/^test_/.test(p.status)){ toast('当前状态不能执行该操作','warn'); return; }
    p.merges = (p.merges||[]).filter(function(m){ return m.stage === 'qa'; });
    p.status = 'dev_merged';
    p.rework = { from:'uat', label:'测试不通过', reason:'测试发现缺陷，需要开发修复后重新合并打包', by:(me()?me().name:'测试'), at: fmtNow() };
    p.submittedAt = null;
  } else {
    if(p.status !== 'release_check'){ toast('当前状态不能执行该操作','warn'); return; }
    p.merges = (p.merges||[]).filter(function(m){ return m.stage === 'qa' || m.stage === 'uat'; });
    p.status = 'testing';
    p.rework = { from:'release', label:'Release 验证不通过', reason:'Release 环境验证未通过，退回测试重建 UAT 包', by:(me()?me().name:'测试'), at: fmtNow() };
  }
  save(); render();
  toast('已退回上一节点，需要重新打包后再流转','warn');
}

/* ---------- 打包 ---------- */
function buildAllowed(p){
  if(p.status === 'dev_merged' || p.status === 'dev_built') return 'qa';
  if(p.status === 'testing') return 'uat';
  if(p.status === 'release_check') return 'release';
  return null;
}
function runBuild(pid){
  var p = pipeOf(pid);
  if(!p){ return; }
  var stage = buildAllowed(p);
  if(!stage){ toast('当前状态不能打包','warn'); return; }
  var needRole = stage === 'qa' ? 'dev' : 'qa';
  if(!canRole(needRole)){ toast(roleLockReason(needRole),'warn'); return; }
  if(runtime.busy || isQueued(p)){ toast('该流水已在打包队列中','warn'); return; }
  var rb = latestBuildOf(p);
  if(rb && rb.status === 'running'){ toast('这条流水的 '+stageLabel(rb.stage)+' 包正在打包中，等它结束再操作','warn'); return; }
  if(runtime.busy || runtime.queue.length){ runtime.queue.push({ pipelineId:p.id, stage:stage }); save(); render(); toast('已加入打包队列（第 '+runtime.queue.length+' 位）','info'); }
  else startBuild(p, stage);
}
function startBuild(p, stage){
  var app = appOf(p);
  var mergeSha = ((p.merges||[]).filter(function(m){ return m.stage === stage; }).slice(-1)[0]||{}).sha || 'unknown';
  var b = {
    id: uid('b'), pipelineId:p.id, stage:stage, mergeSha:mergeSha, status:'running',
    startedAt: fmtNow(), duration:'—', progress:0,
    artifact:null, log:[ '$ git fetch origin', '$ git checkout '+branchName(p,stage), '$ ./build_app --flavor '+stage+'' ]
  };
  state.builds.push(b);
  p.buildId = b.id;
  p.building = true;
  runtime.busy = { buildId:b.id, pipelineId:p.id };
  save(); render();
  var steps = [
    ['Switched to branch '+branchName(p,stage), 300],
    ['Building '+ (p.artifactType || (app?app.artifactType:'apk')) +' …', 900],
    ['Gradle task assemble' + (stage==='release'?'Release':'Debug'), 1800],
    ['BUILD SUCCESSFUL in 2m 46s', 2600],
    ['artifact -> '+(app?app.code:'app')+'_'+stage+'_'+String(fmtNow()).replace(/[-: ]/g,'').slice(0,12)+'.'+(p.artifactType||'apk'), 3200]
  ];
  steps.forEach(function(s){
    setTimeout(function(){
      if(b.status !== 'running') return;
      b.log.push(s[0]); b.progress = Math.min(96, Math.round(s[1]/3400*100));
      updateLive();
    }, s[1]);
  });
  setTimeout(function(){
    if(b.status !== 'running') return;
    var type = p.artifactType || (app?app.artifactType:'apk');
    var name = (app?app.code:'app') + '_' + stage + '_' + String(fmtNow()).replace(/[-: ]/g,'').slice(0,12) + '.' + type;
    b.status = 'success';
    b.progress = 100;
    b.duration = '2m 51s';
    b.artifact = { name:name, size:(12 + Math.random()*20).toFixed(1)+'MB', type:type, url:'/artifacts/'+b.id };
    b.log.push('upload -> /artifacts/'+b.id);
    p.building = false;
    p.buildId = b.id;
    if(stage === 'qa' && p.status === 'dev_merged') p.status = 'dev_built';
    runtime.busy = null;
    save(); drainQueue(); render();
    toast('打包成功：'+name,'success');
  }, 3600);
}
function drainQueue(){
  if(runtime.busy) return;
  while(runtime.queue.length){
    var q = runtime.queue.shift();
    var p = pipeOf(q.pipelineId);
    if(!p) continue;
    if(buildAllowed(p) !== q.stage) continue;
    startBuild(p, q.stage);
    return;
  }
  save(); render();
}
function updateLive(){
  var box = byId('logRoot');
  var b = runtime.busy ? state.builds.find(function(x){ return x.id === runtime.busy.buildId; }) : null;
  if(!b || !box) return;
  var pbox = box.querySelector('[data-live-progress]');
  if(pbox) pbox.style.width = (b.progress||0)+'%';
  var lbox = box.querySelector('[data-live-log]');
  if(lbox) lbox.innerHTML = logHTML(b) + '<div class="ll ll-dim">▍</div>';
  lbox && (lbox.scrollTop = lbox.scrollHeight);
}

/* ---------- 流水操作按钮 ---------- */
function pipeActions(p){
  var acts = [];
  var st = p.status;
  var t = taskOf(p.taskId), rank = t ? taskRank(t) : 0;
  var qaBuild = freshBuild(p,'qa'), uatBuild = freshBuild(p,'uat'), relBuild = freshBuild(p,'release');
  var needStart = { dis:true, reason:'先在任务详情点「开始开发」，任务进入开发中才能合并 QA' };
  var needTest  = { dis:true, reason:'先在任务详情点「开始测试」，任务进入测试中才能合并 UAT' };
  var needRel   = { dis:true, reason:'先在任务详情点「进入待发布」，任务进入发布阶段才能合并 Release' };
  if(st === 'none'){
    acts = [{act:'mergeQa', label:'合并 QA', role:'dev', dis: rank < 1, reason: needStart.reason}];
  } else if(st === 'dev_conflict'){
    acts = [{act:'resolve', label:'已解决冲突 · 合并', role:'dev'}];
  } else if(st === 'dev_merging' || st === 'test_merging' || st === 'release_merging' || st === 'accept_merging'){
    acts = [];
  } else if(st === 'dev_merged'){
    if(p.rework){
      acts = [{act:'mergeQa', label:'重新合并 QA', role:'dev', dis: rank < 1, reason: needStart.reason}, {act:'build', label:'打包 QA', kind:'build', role:'dev', dis:true, reason:'需要先重新合并 QA'}];
    } else if(qaBuild){
      acts = [{act:'qaPass', label:'自测通过', role:'dev'}, {act:'qaReject', label:'拒绝', kind:'danger', role:'dev'}];
    } else {
      acts = [{act:'build', label:'打包 QA', kind:'build', role:'dev'}, {act:'mergeQa', label:'重新合并 QA', role:'dev', dis:true, reason:'先打包'}];
    }
  } else if(st === 'dev_built'){
    acts = [{act:'qaPass', label:'自测通过', role:'dev'}, {act:'qaReject', label:'拒绝 · 回到合并', kind:'danger', role:'dev'}, {act:'build', label:'重新打包 QA', kind:'build', role:'dev'}];
  } else if(st === 'dev_passed'){
    acts = [{act:'mergeUat', label:'合并 UAT', role:'qa', dis: rank < 3, reason: needTest.reason}];
  } else if(st === 'test_conflict'){
    acts = [{act:'resolve', label:'已解决冲突 · 合并', role:'qa'}];
  } else if(st === 'testing'){
    acts = [{act:'build', label:'打包 UAT', kind:'build', role:'qa', dis:!!uatBuild, reason: uatBuild?'UAT 包已就绪':'先合并 UAT'}];
    acts.push({act:'prepareRelease', label:'合并 Release', role:'qa', dis: rank < 4 || !uatBuild,
      reason: rank < 4 ? needRel.reason : '先打包 UAT'});
    acts.push({act:'rejectTest', label:'测试不通过', kind:'danger', role:'qa'});
  } else if(st === 'release_conflict'){
    acts = [{act:'resolve', label:'已解决冲突 · 合并', role:'qa'}];
  } else if(st === 'release_check'){
    acts = [{act:'build', label: relBuild?'重新打包 Release':'打包 Release', kind:'build', role:'qa'}];
    if(relBuild){
      acts.push({act:'verifyPass', label:'验证通过', role:'qa'});
      acts.push({act:'rejectRelease', label:'验证不通过', kind:'danger', role:'qa'});
    }
  } else if(st === 'release_verified'){
    var b = buildOf(p);
    acts = [];
    if(b) acts.push({act:'download', label:'下载产物', kind:'build', role:null, id:b.id});
    acts.push({act:'accept', label:'合回 master', role:'qa'});
  } else if(st === 'accept_conflict'){
    acts = [{act:'resolve', label:'已解决冲突 · 合并', role:'qa'}];
  } else if(st === 'done'){
    var b2 = buildOf(p);
    acts = b2 ? [{act:'download', label:'下载产物', kind:'ghost', role:null, id:b2.id}] : [];
  }
  return acts;
}

function fmtDateTime(ts){
  var d = new Date(ts);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function taskBranch(t){
  var ps = pipesOf(t.id);
  return ps.length ? ps[0].branch : 'feature/'+String(t.id).toLowerCase().replace(/[^a-z0-9-]+/g,'-');
}
function commitsOfTask(t){
  var branch = taskBranch(t), s = 0;
  for(var i=0;i<branch.length;i++) s = (s*131 + branch.charCodeAt(i)) % 99991;
  for(var j=0;j<String(t.id).length;j++) s = (s*137 + String(t.id).charCodeAt(j)) % 99991;
  var authors = [];
  authors.push(ownerName(t));
  authors.push('林舟','周然','许一鸣');
  var base = new Date(2026,10,19,19,10).getTime();
  var out = [];
  for(var k=0;k<20;k++){
    s = Math.abs((s*1103515245 + 12345) % 2147483648);
    var hex = s.toString(16); while(hex.length<7) hex = '0'+hex;
    out.push({
      sha: hex.slice(0,7),
      msg: COMMIT_MSGS[(s + k) % COMMIT_MSGS.length],
      author: authors[(k + (s % authors.length)) % authors.length],
      at: fmtDateTime(base - k*7.2*3600*1000 - (s%5)*60000)
    });
  }
  return out;
}

function reqStatus(r){
  var ts = tasksOf(r.id);
  if(!ts.length) return { label:'待拆任务', cls:'none' };
  var states = ts.map(taskState);
  if(states.every(function(s){ return s.key === 'done'; })) return { label:'已完成', cls:'done' };
  if(states.some(function(s){ return s.key === 'overdue'; })) return { label:'有超时', cls:'overdue' };
  if(states.some(function(s){ return ['dev','ready','testing','release'].indexOf(s.key) >= 0; })) return { label:'进行中', cls:'dev' };
  return { label:'待开始', cls:'none' };
}

      '<td><span class="t-title" data-act="open-task" data-id="'+t.id+'">'+esc(t.title)+'</span>'+
        '<div class="t-sub">'+esc(t.desc).slice(0,42)+'</div></td>'+

      '<td>'+taskStatusPill(t)+'</td>'+
      '<td>'+progressBar(t)+'</td>'+

      '</td></tr>';

    '<div class="detail-head"><div class="detail-top"><div>'+
        '<div class="req-code">'+esc(r.code)+'</div><div class="detail-title">'+esc(r.title)+'</div>'+
        '<div class="detail-desc">'+esc(r.desc)+'</div></div>'+
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
          '<span class="pri pri-'+esc(r.priority)+'">优先级 '+esc(r.priority)+'</span>'+
          '<span class="pill pill-'+st.cls+'">'+esc(st.label)+'</span></div></div>'+
      '<div class="detail-meta"><span>开发 <b>'+esc(personName(r.devOwner))+'</b></span><span>测试 <b>'+esc(personName(r.qaOwner))+'</b></span>'+
        '<span>产品 <b>'+esc(personName(r.pmOwner))+'</b></span>'+
        '<span>创建 <b>'+esc(r.createdAt)+'</b></span><span>期望完成 <b>'+esc(r.due)+'</b></span>'+
        '<span>任务 <b>'+ts.length+'</b></span><span>CI 流水 <b>'+state.pipelines.filter(function(p){ return pipesOf.call(null,p.taskId) && taskOf(p.taskId) && taskOf(p.taskId).reqId===r.id; }).length+'</b></span>'+
      '</div></div>'+
    '<div class="card" style="padding:0;overflow:hidden">'+
      '<div class="card-head" style="padding:14px 16px 12px"><h2>任务拆分</h2><span class="muted">'+ts.length+' 个任务 · 任务下可再挂多条 CI 流水</span>'+
        '<div class="head-actions">'+taskCreateBtn(r,'btn btn-primary')+qaMemberBtn(r,'btn')+'</div></div>'+
      (ts.length ? '<table class="grid"><thead><tr><th style="width:30%">任务</th><th>CI 流水</th><th style="width:15%">状态</th><th style="width:15%">进度</th><th style="width:8%"></th></tr></thead><tbody>'+rows+'</tbody></table>'
        : '<div class="empty" style="padding:40px"><div class="big">还没有任务</div>把需求拆成可交付的任务</div>')+
    '</div>';
}

/* ---------- 视图：产物 ---------- */
function viewArtifacts(){
  var list = state.builds.slice();
  if(ui.artifactApp !== 'all') list = list.filter(function(b){
    var p = pipeOf(b.pipelineId); return p && p.appId === ui.artifactApp;
  });
  list.sort(function(a,b){ return String(a.startedAt) < String(b.startedAt) ? 1 : -1; });
  var ok = 0, run = 0, fail = 0;
  list.forEach(function(b){
    if(b.status === 'success') ok++; else if(b.status === 'running') run++; else fail++;
  });
  var rows = list.map(function(b){
    var p = pipeOf(b.pipelineId), t = p ? taskOf(p.taskId) : null, app = p ? appOf(p) : null;
    var st = buildStatusMeta(b);
    var artCell;
    if(b.status === 'success'){
      artCell = '<span class="mono" style="font-size:11.5px;word-break:break-all">'+esc(b.artifact.name)+'</span>';
    } else if(b.status === 'running'){
      artCell = '<div class="build-running"><span class="spin"></span>正在打包 · '+(b.progress||0)+'%</div>'+
        '<div class="t-sub mono">'+(app?esc(app.code):'app')+'_'+esc(b.stage)+'_…'+(b.artifactType||(app?app.artifactType:''))+'</div>';
    } else {
      artCell = '<div class="build-failed">构建失败，暂无产物</div>'+
        (b.failReason ? '<div class="t-sub ellip" title="'+esc(b.failReason)+'">'+esc(b.failReason)+'</div>' : '');
    }
    return '<tr data-act="build-detail" data-id="'+b.id+'" class="row-click">'+
      '<td>'+artCell+'</td>'+
      '<td><div class="cell-clamp2" title="'+esc(app?app.name:'—')+'">'+esc(app?app.name:'—')+'</div><div class="t-sub ellip">'+esc(p?p.name:'')+'</div></td>'+
      '<td><div class="cell-clamp2" title="'+esc(t?t.title:'—')+'">'+esc(t?t.title:'—')+'</div></td>'+
      '<td><span class="stage-tag">'+esc(stageLabel(b.stage))+'</span><div class="t-sub mono">'+esc(b.mergeSha)+'</div></td>'+
      '<td><span class="pill pill-'+st.cls+'">'+esc(st.label)+'</span></td>'+
      '<td>'+esc(b.artifact?b.artifact.size:'—')+'</td>'+
      '<td class="mono" style="font-size:11px;white-space:nowrap">'+esc(b.startedAt)+'</td>'+
      '<td style="text-align:right;white-space:nowrap">'+
        '<button type="button" class="btn btn-sm" data-act="build-detail" data-id="'+b.id+'">详情</button>'+
        (b.status === 'running' ? ' <button type="button" class="btn btn-sm btn-ghost" data-act="open-log" data-id="'+b.id+'">日志</button>' : '')+
        (b.status === 'success' ? ' <button type="button" class="btn btn-sm btn-primary" data-act="download" data-id="'+b.id+'">下载</button>' : '')+
        (b.status === 'failed' ? ' <button type="button" class="btn btn-sm btn-ghost" data-act="open-log" data-id="'+b.id+'">日志</button>' : '')+
      '</td></tr>';
  }).join('');
  return '<div class="page-head"><div><h1>打包产物</h1><p class="sub">已入库产物可下载（链接不鉴权）；正在打包与打包失败的构建也在列表里，点行看详情与打包日志</p></div></div>'+
    '<div class="req-toolbar"><select data-role="artifact-app">'+
      '<option value="all"'+(ui.artifactApp==='all'?' selected':'')+'>全部应用</option>'+
      state.apps.map(function(a){ return '<option value="'+a.id+'"'+(ui.artifactApp===a.id?' selected':'')+'>'+esc(a.name)+'</option>'; }).join('')+
    '</select>'+
    '<span class="muted" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">共 '+list.length+' 条 · '+
      '<span class="pill pill-done">已入库 '+ok+'</span>'+
      '<span class="pill pill-building">打包中 '+run+'</span>'+
      '<span class="pill pill-failed">失败 '+fail+'</span></span></div>'+
    (list.length ? '<div class="card" style="padding:0;overflow:hidden"><table class="grid" style="table-layout:fixed">'+
      '<thead><tr><th style="width:24%">产物</th><th style="width:11%">应用</th><th style="width:15%">任务</th><th style="width:10%">阶段</th><th style="width:8%">状态</th><th style="width:6%">大小</th><th style="width:14%">构建时间</th><th style="width:12%"></th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div>'
      : '<div class="card"><div class="empty"><div class="big">还没有构建</div>流水点「打包」后可在这里看正在打包与失败的记录</div></div>');
}

        '<li>任务只表达交付单元与负责人；建任务时填计划开始时间与结束时间，一个任务可以挂多条 CI 流水（Flutter 任务可同时打 Android apk 与 iOS ipa）。</li>'+

        '<li>菜单权限由管理员在「角色权限」里按「角色 × 级别」勾选维护；人员由管理员在「人员管理」里新增并分配账号、初始密码、角色与级别。</li>'+

/* ---------- 任务详情：可扩展的按钮与 tab ---------- */
/* 任务状态推进（流水只负责合并 / 冲突 / 打包 / 通过 / 拒绝，开始开发、提测、开始测试、待发布、结束都在任务上） */
var TASK_STEPS = {
  none:    { act:'taskStart',   label:'开始开发',          to:'dev',     role:'dev' },
  dev:     { act:'taskSubmit',  label:'提测',              to:'ready',   role:'dev' },
  ready:   { act:'taskTest',    label:'开始测试',          to:'testing', role:'qa'  },
  testing: { act:'taskRelease', label:'进入待发布',        to:'release', role:'qa'  },
  release: { act:'taskFinish',  label:'完成发布 · 已结束', to:'done',    role:'qa'  }
};
function taskGate(t, step){
  var ps = pipesOf(t.id);
  if(step.to === 'ready'){
    if(!ps.length) return '还没有 CI 流水：先在「CI 流水」页建一条，走完合并 QA / 打包 / 自测';
    var ok = ps.filter(function(p){ return p.status === 'dev_passed' && freshBuild(p,'qa'); });
    if(!ok.length) return '还没有自测通过的流水：需要至少一条流水「合并 QA → 打包 → 自测通过」';
  }
  if(step.to === 'testing'){
    var ok2 = ps.filter(function(p){ return p.status === 'dev_passed'; });
    if(!ok2.length) return '还没有自测通过的流水，无法开始测试';
  }
  if(step.to === 'release'){
    var ok3 = ps.filter(function(p){ return !!freshBuild(p,'uat'); });
    if(!ok3.length) return '需要至少一条流水有成功的 UAT 包（先合并 UAT 再打包）';
  }
  if(step.to === 'done'){
    var ok4 = ps.filter(function(p){ return p.status === 'done' || p.status === 'release_verified'; });
    if(!ok4.length) return '需要至少一条流水 Release 验证通过并合回 master，才能结束任务';
  }
  return '';
}
function taskStepMeta(t){
  var step = TASK_STEPS[taskStatusKey(t)];
  if(!step) return null;
  var need = taskGate(t, step);
  return { act:step.act, label:step.label, role:step.role, to:step.to, dis: !!need, reason: need };
}
function advanceTask(tid){
  var t = taskOf(tid);
  if(!t) return;
  var step = TASK_STEPS[taskStatusKey(t)];
  if(!step) return;
  if(step.role && !canRole(step.role)){ toast(roleLockReason(step.role),'warn'); return; }
  var need = taskGate(t, step);
  if(need){ toast(need,'warn'); return; }
  t.status = step.to;
  t.statusAt = fmtNow();
  t.statusBy = me() ? me().name : '—';
  if(step.to === 'ready'){
    pipesOf(t.id).forEach(function(p){ if(p.status === 'dev_passed') p.submittedAt = fmtNow(); });
  }
  if(step.to === 'done') t.finishedAt = fmtNow();
  save(); render();
  var msg = {
    dev:     '任务已开始开发，去流水里合并 QA',
    ready:   '已提测，等测试在任务详情点「开始测试」',
    testing: '已开始测试，去流水里合并 UAT 并打包',
    release: '已进入待发布，去流水里合并 Release 并打包验证',
    done:    '任务已发布结束，产物可继续下载'
  }[step.to] || '任务状态已更新';
  toast(msg, 'success');
}
var TASK_ACTIONS = [
  { act:'new-pipe',   label:'+ CI 流水', primary:true, role:'dev',  always:true },
  { act:'open-req',   label:'打开需求',  role:null },
  { act:'del-task',   label:'删除任务',  role:'admin', danger:true }
];
var TASK_TABS = [
  { key:'overview', label:'概览' },
  { key:'pipes',    label:'CI 流水' },
  { key:'commits',  label:'提交记录' },
  { key:'builds',   label:'构建记录' }
];
function tabCount(t, key){
  if(key === 'pipes') return pipesOf(t.id).length;
  if(key === 'commits'){ return 20; }
  if(key === 'builds'){
    var b = 0; pipesOf(t.id).forEach(function(p){ b += buildsOf(p).length; }); return b;
  }
  return null;
}
function taskActionBar(t){
  var step = taskStepMeta(t), head = '';
  if(step){
    var locked = step.role ? !canRole(step.role) : false;
    var dis = step.dis || locked;
    var toLabel = (TASK_STATES[step.to]||{}).label || '';
    var title = dis ? (locked ? roleLockReason(step.role) : step.reason) : ('把任务状态推进到「'+toLabel+'」');
    head += '<button type="button" class="btn btn-sm btn-primary" data-act="'+step.act+'" data-id="'+t.id+'"'+
      (dis ? ' disabled' : '') + ' title="'+esc(title)+'">'+esc(step.label)+'</button>';
  }
  return head + TASK_ACTIONS.map(function(a){
    var locked = a.role ? !canRole(a.role) : false;
    var cls = 'btn btn-sm' + (a.primary ? ' btn-primary' : '') + (a.danger ? ' btn-danger-line' : '');
    return '<button type="button" class="'+cls+'" data-act="'+a.act+'" data-id="'+t.id+'"' +
      (locked ? ' disabled title="'+esc(roleLockReason(a.role))+'"' : '') + '>'+esc(a.label)+'</button>';
  }).join('') + '<span class="tb-gap"></span>';
}
function taskTabs(t){
  return TASK_TABS.map(function(tb){
    var c = tabCount(t, tb.key);
    return '<button type="button" class="tab'+(ui.tab===tb.key?' on':'')+'" data-act="tab" data-id="'+tb.key+'">'+
      esc(tb.label)+(c!=null?'<span class="tab-n">'+c+'</span>':'')+'</button>';
  }).join('');
}

/* ---------- 流水卡片（任务详情内） ---------- */
function pipeCard(p){
  var app = appOf(p), meta = STATUS_META[p.status] || STATUS_META.none;
  var stage = currentStage(p), target = branchName(p, stage);
  var b = buildOf(p);
  var lb0 = latestBuildOf(p), running0 = !!(lb0 && lb0.status === 'running');
  var acts = pipeActions(p).map(function(a){
    if(running0 && a.act === 'build'){
      var c = {}; for(var k in a) c[k] = a[k];
      c.dis = true; c.reason = '正在打包中，等这次构建结束再操作';
      return c;
    }
    return a;
  });
  var actHTML = acts.length ? acts.map(function(a){ return actionBtn(a, p.id); }).join('')
    : '<span class="muted">'+ (p.status==='done' ? '流水已结束' : '处理中…') +'</span>';
  return '<div class="pipe-card">'+
    '<div class="pc-top"><div class="pc-title"><b>'+esc(p.name)+'</b>'+
      '<span class="pc-app">'+esc(app?app.name:'—')+' · '+esc(app?platformLabel(app.platform):'')+' · '+esc(p.artifactType||'')+'</span></div>'+
      '<span class="pill pill-'+meta.cls+'">'+esc(meta.label)+'</span></div>'+
    '<div class="pc-branch"><span class="mono">'+esc(p.branch)+'</span><span class="pc-arrow">→</span>'+
      '<span class="bchip '+stage+'">'+esc(target)+'</span>'+
      '<span class="pc-stage">'+esc(stageLabel(stage))+' 阶段</span></div>'+
    '<div class="pc-dots">'+pipeDots(p)+'</div>'+
    '<div class="pc-meta">'+
      '<span>最近合并 '+(function(){ var m=(p.merges||[]).slice(-1)[0]; return m? '<b class="mono">'+esc(m.sha)+'</b> '+esc(String(m.at).slice(5)) : '<span class="muted">—</span>'; })()+'</span>'+
      '<span>产物 '+(b? '<b class="mono">'+esc(shortArtifact(b))+'</b>' : '<span class="muted">—</span>')+'</span>'+
      (function(){ var lb = latestBuildOf(p); return (lb && lb.status === 'running')
        ? '<span class="pill pill-building"><span class="spin"></span>打包中 '+(lb.progress||0)+'%</span>' : ''; })()+
    '</div>'+
    (/conflict/.test(p.status)? '<div class="pc-conflict">存在冲突 · 临时分支 '+esc(tempBranchName(p,stage))+' 解决后点「已解决冲突 · 合并」</div>' : '')+
    (p.rework? '<div class="pc-rework">'+esc(p.rework.label)+'：'+esc(p.rework.reason)+'</div>' : '')+
    (function(){
      var tip = acts.filter(function(a){ return a.dis && /任务详情/.test(a.reason||''); })[0];
      return tip ? '<div class="pc-tip">'+esc(tip.reason)+'</div>' : '';
    })()+
    '<div class="pc-acts">'+actHTML+
      '<button type="button" class="btn btn-sm btn-ghost" data-act="pipe-log" data-id="'+p.id+'">打包日志</button>'+
      '<button type="button" class="btn btn-sm btn-ghost" data-act="open-pipe" data-id="'+p.id+'">流水详情</button></div>'+
  '</div>';
}
function pipeDots(p){
  var filled = mergedCount(p);
  var out = '';
  for(var i=0;i<4;i++){
    var cls = i < filled ? 'on' : (i === filled ? 'cur' : '');
    out += '<span class="sd '+cls+'"></span>';
  }
  return '<div class="stage-dots-in">'+out+'</div>';
}

      '<div class="task-actions">'+taskCreateBtn(r)+qaMemberBtn(r)+'</div>'+
      '<div class="blk-title">需求描述</div><p class="hint">'+esc(r.desc||'—')+'</p>'+

function logHTML(b){
  if(!b) return '';
  if(!b.log || !b.log.length) return '<div class="log-empty">历史构建日志已归档</div>';
  return b.log.map(function(l){
    var cls = 'll ll-out';
    if(/^\$/.test(l)) cls = 'll ll-cmd';
    else if(/SUCCESS|成功|upload/.test(l)) cls = 'll ll-ok';
    else if(/error|FAILED|冲突/.test(l)) cls = 'll ll-err';
    else if(/Building|Gradle/.test(l)) cls = 'll ll-warn';
    return '<div class="'+cls+'">'+esc(l)+'</div>';
  }).join('');
}
